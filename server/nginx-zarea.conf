# Hotel Zarea site — nginx server block. Static files only: no PHP, no database, no upload endpoint.
# Replace zarea.example.org and the certificate paths, then: nginx -t && systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name zarea.example.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name zarea.example.org;

    root /var/www/zarea;
    index index.html;

    ssl_certificate     /etc/ssl/zarea/fullchain.pem;
    ssl_certificate_key /etc/ssl/zarea/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:zarea:10m;
    ssl_session_tickets off;

    server_tokens off;
    autoindex off;
    charset utf-8;
    client_max_body_size 1k;          # nothing is ever uploaded
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }

    # Security headers (always = also on 404/error responses)
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data: blob: https://tiles.openfreemap.org; font-src 'self'; media-src 'self'; connect-src 'self' https://tiles.openfreemap.org; worker-src blob:; child-src blob:; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; upgrade-insecure-requests" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Basic rate limit against scripted floods (define the zone once in nginx.conf http{}):
    #   limit_req_zone $binary_remote_addr zone=zarea:10m rate=20r/s;
    # limit_req zone=zarea burst=60 nodelay;

    # Never serve dotfiles, notes, tooling
    location ~ /\. { deny all; return 404; }
    location ~* \.(md|py|sh|bak|orig|swp|log|sql|ini|env|ya?ml|toml|lock)$ { deny all; return 404; }

    # Explicit MIME table for the file types in this static site.
    types {
        text/html html;
        text/css css;
        application/javascript js;
        application/json json;
        application/geo+json geojson;
        application/pdf pdf;
        image/jpeg jpg jpeg;
        image/png png;
        image/svg+xml svg;
        image/x-icon ico;
        image/avif avif;
        image/webp webp;
        video/mp4 mp4;
        font/woff2 woff2;
    }
    default_type application/octet-stream;

    # Filenames can be reused between releases; revalidate before using cached files.
    # Keep headers at server level so all locations inherit the security headers.
    add_header Cache-Control "no-cache" always;

    location / { try_files $uri $uri/ =404; }

    gzip on;
    gzip_types text/css application/javascript application/json application/geo+json image/svg+xml;
    gzip_min_length 1024;
}
